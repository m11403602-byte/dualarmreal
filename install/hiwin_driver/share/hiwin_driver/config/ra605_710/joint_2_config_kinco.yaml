# Configuration file for Kinco FD_RX drive
vendor_id: 0x0000aaaa
product_id: 0x00000005
assign_activate: 0x0300  # DC Synch register
auto_fault_reset: false  # true = automatic fault reset, false = fault reset on rising edge command interface "reset_fault"
auto_state_transitions: true

tpdo:  # TxPDO = transmit PDO Mapping
  - index: 0x1a00
    channels:
      - {index: 0x6041, sub_index: 0, type: uint16}  # Status word
      - {index: 0x6061, sub_index: 0, type: int8}  # Mode of operation display
      - {index: 0x6064, sub_index: 0, type: int32, state_interface: position, factor: 0.000009588}  # Position actual value 2π / (131072 * 80)
      - {index: 0x603f, sub_index: 0, type: uint16}  # Error code

rpdo:  # RxPDO = receive PDO Mapping
  - index: 0x1600
    channels:
      - {index: 0x6040, sub_index: 0, type: uint16, default: 0}  # Control word
      - {index: 0x6060, sub_index: 0, type: int8, default: 8}  # Mode of operation
      - {index: 0x607a, sub_index: 0, type: int32, command_interface: position, default: .nan, factor: 104297.037964122}  # Target position
