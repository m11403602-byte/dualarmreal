# ============================================================================
# small_arm_controllers.yaml
# 用途: 小手臂 (RA605-710) 在 namespace /small_arm 下的 controller 設定
# ============================================================================

small_arm:
  controller_manager:
    ros__parameters:
      update_rate: 500  # Hz — 匹配 EtherCAT control_frequency

      small_arm_controller:
        type: joint_trajectory_controller/JointTrajectoryController

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      reset_fault_controller:
        type: hiwin_controllers/ResetFaultController

  small_arm_controller:
    ros__parameters:
      allow_partial_joints_goal: true
      joints:
        - small_joint_1
        - small_joint_2
        - small_joint_3
        - small_joint_4
        - small_joint_5
        - small_joint_6
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity

  reset_fault_controller:
    ros__parameters:
      update_rate: 100
      trajectory_action_server: "/small_arm/small_arm_controller/follow_joint_trajectory"
      joints:
        - small_joint_1
        - small_joint_2
        - small_joint_3
        - small_joint_4
        - small_joint_5
        - small_joint_6
      command_interfaces:
        - reset_fault
      state_interfaces:
        - position

  joint_state_broadcaster:
    ros__parameters:
      joints:
        - small_joint_1
        - small_joint_2
        - small_joint_3
        - small_joint_4
        - small_joint_5
        - small_joint_6
